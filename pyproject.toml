[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-evt-agent"
version = "0.1.0"
description = "Multi-agent EVT detection and graph source-localization toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "mistralai>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "matplotlib>=3.6", "nbformat>=5", "nbclient>=0.7", "ipykernel>=6"]
edf = ["pyEDFlib>=0.1.38"]
viz = ["matplotlib>=3.6"]
progress = ["tqdm>=4.60"]
notebooks = ["matplotlib>=3.6", "tqdm>=4.60", "pandas>=1.5", "jupyterlab>=4"]

[tool.setuptools.packages.find]
include = ["graph_evt_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
